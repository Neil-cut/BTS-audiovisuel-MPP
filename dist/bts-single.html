rmat UHD/4K ?","o":["1920 x 1080","1280 x 720","3840 x 2160","2560 x 1080","4096 x 2160 uniquement"],"c":2,"e":"Le format UHD/4K correspond à une résolution de 3840 x 2160 pixels.","s":"Bits, débits & vidéo"},{"q":"Combien de fois plus de pixels l’UHD/4K contient-il par rapport au Full HD selon la fiche ?","o":["2 fois plus","4 fois plus","8 fois plus","10 fois plus","Autant de pixels"],"c":1,"e":"L’UHD/4K contient environ 4 fois plus de pixels que le Full HD.","s":"Bits, débits & vidéo"},{"q":"Quel format est décrit comme « le plus courant (TV, streaming, jeux) » ?","o":["HD","FHD (Full HD)","UHD/4K","720p uniquement","1080i50 uniquement"],"c":1,"e":"Le Full HD (FHD) est le format le plus courant, utilisé en télévision, streaming et jeux vidéo.","s":"Bits, débits & vidéo"},{"q":"Comment fonctionne le balayage entrelacé selon la fiche ?","o":["Toutes les lignes sont affichées en même temps","Les lignes paires puis impaires sont affichées en alternance","Seules les lignes paires sont affichées","L’image est divisée en quatre quadrants","Il n’y a pas de lignes affichées"],"c":1,"e":"Dans le balayage entrelacé, les lignes paires de l’image sont affichées puis les lignes impaires, en alternance rapide.","s":"Bits, débits & vidéo"},{"q":"Quel est l’avantage du balayage entrelacé mentionné dans la fiche ?","o":["Il offre une meilleure netteté","Il économise de la bande passante","Il élimine le scintillement","Il augmente la résolution","Il double la cadence d’images"],"c":1,"e":"L’avantage du balayage entrelacé est d’économiser de la bande passante en n’envoyant qu’une partie de l’image à chaque passage.","s":"Bits, débits & vidéo"},{"q":"Quel est l’avantage du balayage progressif selon la fiche ?","o":["Il économise davantage de bande passante que l’entrelacé","Il offre une image plus nette, sans scintillement","Il divise la résolution par deux","Il fonctionne uniquement en noir et blanc","Il ne nécessite pas d’écran"],"c":1,"e":"Le balayage progressif offre une image plus nette et sans scintillement, car toutes les lignes sont affichées d’un coup.","s":"Bits, débits & vidéo"},{"q":"Que signifie une cadence de 25 fps ?","o":["25 images complètes affichées chaque seconde","25 pixels par image","25 secondes par image","25 Mbit/s de débit","25 couleurs affichées"],"c":0,"e":"Une cadence de 25 fps signifie que 25 images complètes sont affichées chaque seconde.","s":"Bits, débits & vidéo"},{"q":"Pourquoi la cadence de 50 fps est-elle utilisée pour le sport ou le ralenti selon la fiche ?","o":["Elle réduit la taille du fichier","Elle rend le mouvement beaucoup plus fluide","Elle nécessite moins de bande passante que 25 fps","Elle correspond au standard américain","Elle élimine le besoin de balayage progressif"],"c":1,"e":"Une cadence de 50 fps rend le mouvement beaucoup plus fluide, ce qui est particulièrement apprécié pour le sport ou le ralenti.","s":"Bits, débits & vidéo"}]},{"n":"Niveau 2","q":[{"q":"Que désigne le cache L1 d’un processeur ?","o":["La mémoire vive principale","La plus petite mémoire, la plus rapide, intégrée au cœur du CPU","Le disque dur système","La mémoire de la carte graphique","Le firmware du BIOS"],"c":1,"e":"Le cache L1 est directement intégré au cœur, minuscule mais quasi aussi rapide que les registres du processeur."},{"q":"Pourquoi la mémoire cache est-elle organisée en plusieurs niveaux (L1, L2, L3) ?","o":["Pour compresser les données","Pour équilibrer vitesse (petite mémoire proche du cœur) et capacité (mémoire plus grande mais plus lente)","Pour chiffrer les données du processeur","Pour remplacer la RAM totalement","Pour gérer le refroidissement"],"c":1,"e":"Plus un cache est proche du cœur, plus il est rapide mais petit ; L3, plus loin, est plus grand mais plus lent : c’est un compromis vitesse/capacité."},{"q":"Qu’est-ce que le multiplicateur de fréquence d’un CPU ?","o":["Le nombre de cœurs physiques","Le facteur par lequel la fréquence de bus est multipliée pour obtenir la fréquence du cœur","Le nombre de threads simultanés","La tension d’alimentation du CPU","Le nombre de caches disponibles"],"c":1,"e":"La fréquence finale du CPU = fréquence de bus × multiplicateur ; augmenter l’un ou l’autre change la vitesse d’horloge."},{"q":"Quelle est la différence entre un northbridge et un southbridge sur les anciennes cartes mères ?","o":["Ce sont deux noms pour le même composant","Le northbridge gère les liaisons rapides (RAM, GPU), le southbridge les périphériques plus lents","Le southbridge gère uniquement le refroidissement","Le northbridge est un type de RAM","Le southbridge remplace le CPU"],"c":1,"e":"Le northbridge gérait les liaisons rapides (RAM, GPU), le southbridge les périphériques plus lents (USB, disques) ; ils sont aujourd’hui souvent fusionnés dans le CPU/chipset."},{"q":"Qu’est-ce que la latence CAS (CL) d’une barrette de RAM ?","o":["Sa capacité en Go","Le nombre de cycles d’horloge avant qu’une donnée demandée soit disponible","Sa fréquence en MHz","Le nombre de broches du connecteur","Sa consommation électrique"],"c":1,"e":"Le CAS Latency compte les cycles d’horloge entre la demande d’une donnée et sa disponibilité : plus il est bas, plus la RAM répond vite à fréquence égale."},{"q":"Quelle est la principale différence entre la DDR4 et la DDR5 ?","o":["La DDR5 n’existe que sur portable","La DDR5 offre des fréquences et bandes passantes plus élevées avec une tension réduite","La DDR4 est plus rapide que la DDR5","Elles utilisent le même connecteur physique","La DDR5 ne fonctionne qu’avec l’AMD"],"c":1,"e":"La DDR5 grimpe à des fréquences plus élevées et gère l’alimentation sur le module lui-même, avec une tension réduite pour l’efficacité énergétique."},{"q":"Qu’apporte la mémoire ECC (Error-Correcting Code) ?","o":["Une fréquence plus élevée","La détection et correction automatique des erreurs de bits en mémoire","Un stockage permanent des données","Une compression des données","Un chiffrement matériel"],"c":1,"e":"L’ECC ajoute des bits de contrôle qui permettent de détecter et corriger les erreurs mémoire, crucial pour les serveurs où la fiabilité prime."},{"q":"Quel est l’avantage principal du protocole NVMe par rapport à AHCI/SATA pour un SSD ?","o":["Il est moins cher","Il permet un parallélisme massif des commandes via PCIe, réduisant fortement la latence","Il fonctionne uniquement en USB","Il n’a pas besoin de pilote","Il stocke plus de données par cellule"],"c":1,"e":"Le NVMe communique directement en PCIe avec de multiples files d’attente parallèles, alors qu’AHCI/SATA était conçu à l’origine pour les disques durs mécaniques plus lents."},{"q":"Que signifie IOPS dans le contexte d’un SSD ?","o":["Le débit séquentiel maximal","Le nombre d’opérations d’entrée/sortie par seconde, révélateur des performances en accès aléatoire","La capacité totale du disque","La température maximale supportée","La durée de vie en années"],"c":1,"e":"Les IOPS comptent les opérations par seconde plutôt que le volume de données, ce qui reflète mieux les performances en accès aléatoire (petits fichiers, base de données)."},{"q":"Qu’est-ce que le RAID 1 ?","o":["Une répartition des données sans redondance pour la vitesse","Une duplication (mise en miroir) des données sur deux disques pour la sécurité","Un chiffrement matériel des disques","Une compression automatique des fichiers","Un protocole réseau"],"c":1,"e":"Le RAID 1 écrit la même donnée sur deux disques simultanément : si un disque tombe en panne, l’autre garde une copie intacte."},{"q":"Quelle est la bande passante par lane (voie) du PCI Express 4.0 ?","o":["~1 Go/s par lane","~2 Go/s par lane","~4 Go/s par lane","~8 Go/s par lane","~16 Go/s par lane"],"c":1,"e":"Chaque génération de PCIe double le débit par lane de la précédente ; la 4.0 atteint environ 2 Go/s par lane (16 Go/s en x8)."},{"q":"Que signifie le chroma subsampling 4:2:0 utilisé en vidéo ?","o":["Une réduction de la résolution spatiale de l’image","Une réduction de la résolution de couleur (chrominance) tout en gardant la pleine luminance","Une compression du son uniquement","Un mode d’affichage entrelacé","Un format de fichier audio"],"c":1,"e":"L’œil humain est plus sensible à la luminosité qu’à la couleur : le 4:2:0 réduit donc la résolution de chrominance sans perte visible notable, économisant de la bande passante."},{"q":"Quelle est la différence fondamentale entre HDR10 et le SDR (Standard Dynamic Range) ?","o":["Le HDR10 offre une plage de luminosité et de contraste bien plus étendue","Le HDR10 réduit la résolution de l’image","Le SDR consomme plus de bande passante","Le HDR10 ne fonctionne qu’en noir et blanc","Il n’y a aucune différence perceptible"],"c":0,"e":"Le HDR élargit la plage entre les noirs profonds et les blancs très lumineux, donnant une image avec beaucoup plus de contraste et de nuances que le SDR classique."},{"q":"Qu’est-ce que le DSC (Display Stream Compression) utilisé par le DisplayPort et le HDMI récents ?","o":["Un chiffrement de sécurité pour la vidéo","Une compression visuellement sans perte permettant de transmettre des résolutions/fréquences plus élevées","Un protocole audio surround","Une réduction de la résolution native de l’écran","Un mode d’économie d’énergie"],"c":1,"e":"Le DSC compresse le flux vidéo de façon quasi imperceptible pour l’œil, ce qui permet de faire passer des résolutions/fréquences que le câble ne supporterait pas en brut."},{"q":"Quelle est la principale différence entre les codecs H.264 et H.265 (HEVC) ?","o":["H.265 offre une meilleure compression pour une qualité équivalente, à coût de calcul plus élevé","H.264 est plus récent que H.265","H.265 ne fonctionne qu’en 4K","H.264 ne compresse pas la vidéo","Ils sont strictement identiques"],"c":0,"e":"H.265 utilise des algorithmes plus sophistiqués (blocs de taille variable, meilleure prédiction) pour diviser le poids du fichier à qualité égale, au prix de plus de calcul à l’encodage/décodage."},{"q":"Que permet le Multi-Stream Transport (MST) du DisplayPort ?","o":["Chaîner plusieurs écrans à partir d’une seule sortie vidéo","Doubler la fréquence du processeur","Fusionner plusieurs disques durs","Augmenter la RAM disponible","Réduire la latence du clavier"],"c":0,"e":"Le MST permet à une seule sortie DisplayPort de gérer plusieurs écrans en série, chacun recevant sa portion de bande passante."},{"q":"Qu’est-ce que le VRR (Variable Refresh Rate), comme le FreeSync ou G-Sync ?","o":["Une synchronisation de la fréquence de rafraîchissement de l’écran avec le nombre d’images produites par le GPU","Un mode de veille automatique de l’écran","Une compression audio adaptative","Un protocole de sécurité HDMI","Une technologie de stockage rapide"],"c":0,"e":"Le VRR ajuste la fréquence de rafraîchissement de l’écran image par image pour qu’elle corresponde exactement au nombre d’images produites, éliminant déchirures et saccades."},{"q":"Quelle est la bande passante totale du standard USB4 ?","o":["480 Mbit/s","5 Gbit/s","10 Gbit/s","40 Gbit/s","100 Gbit/s"],"c":3,"e":"L’USB4 reprend l’architecture du Thunderbolt 3 et atteint jusqu’à 40 Gbit/s, loin devant les 10 Gbit/s de l’USB 3.2 Gen 2."},{"q":"Qu’est-ce que le jitter dans une transmission réseau ou vidéo ?","o":["La perte totale du signal","La variation de la latence entre les paquets ou trames reçus","Le débit maximal théorique","La résolution maximale supportée","Un type de compression"],"c":1,"e":"Le jitter, c’est l’irrégularité du délai entre les paquets : même avec un bon débit moyen, un jitter élevé casse la fluidité audio/vidéo en temps réel."},{"q":"Pourquoi la fibre optique monomode a-t-elle une portée bien supérieure à la multimode ?","o":["Elle transporte plus de couleurs","Son cœur plus fin limite la dispersion du signal lumineux sur de longues distances","Elle utilise l’électricité au lieu de la lumière","Elle est toujours plus large que la multimode","Elle ne nécessite pas de connecteur"],"c":1,"e":"Le monomode utilise un cœur très fin qui limite la dispersion modale du signal lumineux, permettant de parcourir des dizaines de kilomètres contre quelques centaines de mètres en multimode."}]},{"n":"Niveau 3","q":[{"q":"Qu’est-ce que l’exécution dans le désordre (out-of-order execution) d’un CPU moderne ?","o":["L’exécution des instructions dans un ordre aléatoire non contrôlé","Une technique où le processeur réordonne dynamiquement les instructions pour éviter d’attendre les dépendances et maximiser les unités d’exécution","Un mode de panne du processeur","Une erreur logicielle à corriger par le BIOS","Un protocole de communication entre cœurs"],"c":1,"e":"Plutôt que d’exécuter les instructions strictement dans l’ordre du programme, le CPU avance sur celles dont les données sont prêtes, puis remet les résultats dans le bon ordre à la fin : cela évite d’attendre inutilement."},{"q":"Que mesure l’IPC (Instructions Per Cycle) d’un processeur ?","o":["Sa fréquence en GHz","Le nombre moyen d’instructions exécutées par cycle d’horloge, reflet de l’efficacité architecturale","Sa consommation électrique en watts","Le nombre de cœurs physiques","La taille du cache L3"],"c":1,"e":"Un IPC élevé signifie que l’architecture accomplit plus de travail utile par cycle, ce qui explique pourquoi deux CPU à la même fréquence peuvent avoir des performances très différentes."},{"q":"Quel est le rôle d’un TLB (Translation Lookaside Buffer) dans un CPU ?","o":["Stocker temporairement les traductions récentes d’adresses virtuelles en adresses physiques pour accélérer la mémoire virtuelle","Traduire les instructions x86 en microcode","Gérer la température du processeur","Stocker les pilotes graphiques","Chiffrer les échanges réseau"],"c":0,"e":"Traduire une adresse virtuelle en adresse physique à chaque accès mémoire serait trop lent : le TLB garde en cache les traductions récentes pour accélérer ce processus."},{"q":"Qu’est-ce que la cohérence de cache (cache coherency) dans un CPU multicœur ?","o":["Le fait que tous les cœurs partagent exactement la même fréquence","Le mécanisme garantissant que tous les cœurs voient une vue cohérente d’une même donnée modifiée en cache","Une technique de compression du cache L3","La synchronisation des ventilateurs du CPU","Le partage de la RAM entre plusieurs PC"],"c":1,"e":"Sans cohérence de cache, un cœur pourrait lire une valeur périmée pendant qu’un autre cœur vient de la modifier dans son propre cache ; le protocole de cohérence synchronise ces copies."},{"q":"Quelle est la différence entre la latence mémoire (en ns) et la bande passante mémoire (en Go/s) ?","o":["Ce sont deux termes identiques pour la même mesure","La latence mesure le délai avant la première donnée, la bande passante mesure le débit une fois le transfert lancé","La latence ne concerne que le SSD, la bande passante que la RAM","La bande passante mesure uniquement la fréquence du CPU","La latence est toujours plus élevée que la bande passante"],"c":1,"e":"La latence est le temps d’attente avant que la première donnée arrive, la bande passante est le débit une fois le flux de données lancé : un système peut avoir une latence faible mais un débit modeste, ou l’inverse."},{"q":"Qu’est-ce que le rank dans une configuration de mémoire DDR (single-rank vs dual-rank) ?","o":["Le nombre de barrettes physiques installées","Un ensemble de puces mémoire sur une barrette agissant comme une unité adressable indépendante, impactant le parallélisme mémoire","La fréquence maximale supportée","La tension nominale du module","La génération de la norme DDR"],"c":1,"e":"Un rank est un groupe de puces qui répond comme une seule unité ; avoir plusieurs ranks permet au contrôleur mémoire d’enchaîner les accès sur des ranks différents sans attendre, améliorant le débit effectif."},{"q":"Pourquoi le NVMe utilise-t-il plusieurs files d’attente (queues) matérielles contrairement à AHCI ?","o":["Pour réduire artificiellement les performances","Pour exploiter le parallélisme du CPU multicœur avec jusqu’à 65 000 files, réduisant la contention et la latence","Pour limiter la capacité de stockage","Parce que le SATA ne permet pas les files d’attente","Pour compresser les données avant écriture"],"c":1,"e":"Avec des dizaines de milliers de files d’attente possibles au lieu d’une seule (AHCI), le NVMe peut exploiter tous les cœurs du CPU pour envoyer des commandes en parallèle sans se bloquer mutuellement."},{"q":"Qu’est-ce que le write amplification sur un SSD ?","o":["Le fait que le volume de données réellement écrit sur la mémoire flash est supérieur au volume logique envoyé, à cause de la gestion des blocs","Une augmentation artificielle de la capacité affichée","Un bug logiciel rare","La compression des données avant écriture","La vitesse de lecture séquentielle"],"c":0,"e":"Les SSD écrivent par blocs entiers : modifier une petite donnée peut obliger à réécrire tout un bloc, donc le volume physique écrit sur la flash dépasse le volume logique demandé, ce qui use la mémoire plus vite."},{"q":"Quelle est la différence entre le PCIe en mode x4 « électrique » et x16 « mécanique » sur un connecteur ?","o":["Il n’y a jamais de différence entre taille physique et nombre de lanes actives","Le connecteur peut être physiquement plus grand (x16) que le nombre de lanes réellement câblées (x4), un choix de conception carte mère","Le mode électrique concerne uniquement l’alimentation du GPU","x4 et x16 désignent toujours la même bande passante","Le mode mécanique ne transmet aucune donnée"],"c":1,"e":"Un connecteur physique x16 peut n’avoir que 4 lanes réellement câblées (x4 électrique) pour réduire les coûts de la carte mère, tout en acceptant physiquement une carte plus large."},{"q":"Qu’est-ce que le DisplayPort Alt Mode sur un port USB-C ?","o":["Un mode qui transmet un signal DisplayPort natif directement sur les broches USB-C, sans conversion de protocole","Un adaptateur logiciel qui convertit l’USB en HDMI","Un mode réservé au chargement rapide uniquement","Une fonction qui désactive le port USB","Un protocole propriétaire incompatible avec DisplayPort"],"c":0,"e":"Le signal DisplayPort est envoyé tel quel sur certaines broches du connecteur USB-C, sans passer par une puce de conversion de protocole, ce qui minimise la latence et la complexité."},{"q":"Quelle est la différence entre la compression vidéo intra-image et inter-image (prédiction temporelle) ?","o":["L’intra-image compresse chaque image indépendamment, l’inter-image exploite les similarités entre images successives (I/P/B-frames)","L’inter-image ne fonctionne qu’en noir et blanc","L’intra-image est toujours plus efficace que l’inter-image","Ce sont deux noms pour la même technique","L’inter-image ne s’applique qu’au son"],"c":0,"e":"L’intra-image compresse chaque image comme une photo isolée (comme un JPEG), tandis que l’inter-image ne stocke que les différences par rapport aux images voisines, ce qui réduit énormément la taille du fichier vidéo."},{"q":"Qu’apporte l’AV1 par rapport au H.265/HEVC en matière de codec vidéo ?","o":["Un codec libre de droits offrant une compression généralement supérieure, au prix d’un encodage plus coûteux en calcul","Un format exclusivement destiné à l’audio","Une compatibilité uniquement avec les anciens téléviseurs","Une résolution maximale limitée au 720p","Un débit fixe non compressible"],"c":0,"e":"L’AV1 est développé par un consortium ouvert (pas de royalties) et utilise des techniques de compression plus avancées que le HEVC, au prix d’un temps d’encodage nettement plus long."},{"q":"Que signifie la profondeur de couleur 10 bits par canal (10-bit) par rapport au 8 bits ?","o":["Une résolution d’image plus élevée","Un nombre de nuances de couleur par canal bien supérieur (1024 contre 256), réduisant le banding visible en HDR","Une fréquence d’images plus élevée","Un débit audio plus élevé","Une compression sans perte garantie"],"c":1,"e":"Avec 8 bits, chaque canal de couleur n’a que 256 nuances possibles, ce qui peut créer des bandes visibles dans les dégradés ; le 10 bits offre 1024 nuances par canal, bien plus fluide, surtout important en HDR."},{"q":"Qu’est-ce que la latence d’affichage (input lag) totale d’un écran inclut-elle typiquement ?","o":["Uniquement le temps de réponse du panneau (pixel response time)","Le traitement du signal par l’électronique de l’écran additionné au temps de réponse du panneau","Uniquement la fréquence de rafraîchissement","Le débit du câble utilisé, rien d’autre","La résolution native de l’écran"],"c":1,"e":"L’écran reçoit le signal, le traite (mise à l’échelle, HDR, etc.) puis l’affiche : ce traitement électronique s’ajoute au temps de réponse physique des pixels pour former le délai total perçu."},{"q":"Pourquoi le Thunderbolt peut-il transporter à la fois PCIe, DisplayPort et USB sur un même câble ?","o":["Parce qu’il tunnelise plusieurs protocoles sur une couche de transport commune à haut débit","Parce qu’il utilise trois câbles physiques distincts en un seul connecteur","Parce qu’il convertit tout en signal analogique","Parce qu’il n’est en réalité que de l’USB renommé","Parce qu’il n’existe qu’une seule norme sans tunnelisation"],"c":0,"e":"Le Thunderbolt établit un tunnel de données générique à très haut débit sur lequel plusieurs protocoles (PCIe, DisplayPort, USB) circulent simultanément, chacun étant encapsulé puis extrait à l’autre bout."},{"q":"Quelle est la différence entre le débit théorique et le débit réel (goodput) d’une liaison réseau ?","o":["Ce sont des synonymes stricts","Le débit théorique est la capacité maximale de la norme, le débit réel tient compte des surcoûts protocolaires, collisions et conditions réelles","Le débit réel est toujours supérieur au débit théorique","Le débit théorique ne concerne que la fibre optique","Le débit réel ne dépend que du câble utilisé"],"c":1,"e":"Les en-têtes de protocole, les retransmissions et les conditions réelles du réseau consomment une partie de la capacité théorique : le débit réellement utile (goodput) est donc toujours inférieur à la norme affichée."},{"q":"Qu’est-ce que le MIMO (Multiple Input, Multiple Output) en Wi-Fi ?","o":["L’utilisation de plusieurs antennes en émission et réception pour transmettre plusieurs flux de données simultanément et améliorer débit/portée","Un mode d’économie d’énergie du routeur","Un protocole de chiffrement Wi-Fi","Une limitation du nombre d’appareils connectés","Un type de câble Ethernet"],"c":0,"e":"En multipliant les antennes, le MIMO envoie plusieurs flux de données sur le même canal en même temps, ce qui augmente le débit total sans avoir besoin de plus de fréquence."},{"q":"Que signifie l’OFDM (Orthogonal Frequency-Division Multiplexing) utilisé en Wi-Fi et en 4G/5G ?","o":["Une technique divisant un canal en nombreuses sous-porteuses orthogonales pour transmettre des données en parallèle et résister aux interférences","Un protocole de sécurité biométrique","Une norme de câblage RJ45","Un format de compression audio","Un mode d’affichage vidéo entrelacé"],"c":0,"e":"En répartissant les données sur de nombreuses sous-porteuses étroites et orthogonales, l’OFDM résiste mieux aux interférences et permet une utilisation plus efficace du spectre disponible."},{"q":"Pourquoi la latence est-elle un facteur plus critique que le débit pour le cloud gaming ou les appels vidéo en temps réel ?","o":["Parce qu’un débit élevé suffit toujours à masquer la latence","Parce que même avec un débit élevé, un délai de transmission trop long rend l’interaction perceptiblement décalée et inutilisable en temps réel","Parce que la latence n’affecte que le stockage local","Parce que le débit et la latence sont mathématiquement identiques","Parce que la latence ne concerne que les réseaux filaires"],"c":1,"e":"Même à très haut débit, chaque paquet met un temps incompressible à faire l’aller-retour ; en temps réel (voix, jeu), c’est ce délai — pas le volume de données — qui rend l’expérience saccadée ou fluide."}]}]}],"mon":[{"id":"attic","i":"🗂️","n":"Quiz Avid Attic","d":"Media Composer : retrouver ses sauvegardes de bins","levels":[{"n":"Quiz","q":[{"s":"Emplacement","q":"Sous Windows, où se trouve le dossier Avid Attic ?","o":["C:/Program Files/Avid/Attic","drive:/Users/Public/Public Documents/Avid editing application","drive:/Users/Nom/Documents/Avid Projects","drive:/Windows/Temp/Avid"],"c":1,"e":"Sous Windows, l’Attic se trouve dans Users/Public/Public Documents/Avid editing application."},{"s":"Emplacement","q":"Sous Mac, quel est le chemin du dossier Avid Attic ?","o":["Macintosh HD/Applications/Avid Attic","Macintosh HD/Users/Shared/Avid editing application/Avid Attic","Macintosh HD/Bibliothèque/Avid/Attic","Macintosh HD/Users/Bureau/Attic"],"c":1,"e":"Sur Mac : Macintosh HD/Users/Shared/Avid editing application/Avid Attic."},{"s":"Procédure","q":"Quelle est la toute première étape pour récupérer un fichier depuis l’Attic ?","o":["Fermer définitivement le projet","Supprimer le bin actuel","Redémarrer l’ordinateur","Réduire (minimiser) l’application Avid"],"c":3,"e":"On commence par minimiser l’application Avid, puis on ouvre le dossier Avid Attic depuis le bureau."},{"s":"Structure","q":"À l’ouverture du dossier Avid Attic, que voit-on ?","o":["Un dossier pour chaque projet","Un dossier pour chaque média importé","Un seul fichier de sauvegarde global","Un dossier pour chaque date"],"c":0,"e":"L’Attic affiche un dossier par projet."},{"s":"Structure","q":"Une fois dans le dossier d’un projet, quel dossier faut-il ouvrir pour trouver les sauvegardes de bins ?","o":["Sequences","Bins","Media Files","Settings"],"c":1,"e":"On ouvre le dossier du projet, puis le dossier Bins, qui contient un dossier par bin du projet."},{"s":"Sauvegardes","q":"Comment est nommé un fichier de sauvegarde d’un bin appelé « Source Clips » ?","o":["Source Clips.1, Source Clips.2…","Backup_Source Clips","Source Clips_copie","SourceClips.bak"],"c":0,"e":"Un fichier de sauvegarde porte le même nom que le bin, avec un numéro ajouté (Source Clips.1, LESSONS.phy=[
les("📖 1. Optique : lentilles, focale, champ et ouverture",`<h3>La lumière</h3><p>La lumière visible est une onde électromagnétique de longueur d’onde 400 à 700 nm (violet → rouge). Dans le vide elle se propage à <b>c ≈ 3 × 10⁸ m/s</b> ; dans un milieu d’indice <b>n</b> (air ≈ 1, eau ≈ 1,33, verre ≈ 1,5), sa vitesse est v = c / n.</p><h3>Réfraction</h3><p>Loi de Snell-Descartes : <b>n₁ sin θ₁ = n₂ sin θ₂</b>. La lumière se rapproche de la normale en entrant dans un milieu plus réfringent : c’est le principe des lentilles.</p><h3>Lentille mince convergente</h3><ul><li><b>Relation de conjugaison</b> (distances positives) : 1/f = 1/p + 1/p′, où p est la distance objet–lentille et p′ la distance lentille–image.</li><li><b>Grandissement</b> : m = p′ / p.</li><li><b>Vergence</b> : C = 1 / f en dioptries (δ). Une focale de 0,5 m donne 2 δ.</li></ul><div class="note"><b>Exemple :</b> objectif de 50 mm, sujet à 2 m. 1/p′ = 1/50 − 1/2000 = 39/2000, d’où p′ ≈ 51,3 mm et m ≈ 0,026. Le capteur se trouve donc un peu plus loin que la focale.</div><h3>Champ angulaire</h3><p>α = 2 · arctan(d / 2f). Pour un capteur de 36 mm de large avec un 50 mm : α ≈ 40° (horizontal). Avec un capteur plus petit et la même focale, le champ est plus étroit (Super 35 de 24,9 mm : ≈ 28°).</p><h3>Ouverture</h3><p>Nombre d’ouverture <b>N = f / D</b>. Un 50 mm à f/2 a un diamètre d’ouverture de 25 mm. La lumière reçue varie comme 1/N² : chaque cran (×√2 sur N) divise la lumière par 2.</p>`),
les("📖 2. Photométrie et caractéristiques de la lumière",`<h3>Les grandeurs</h3><table><tr><th>Grandeur</th><th>Symbole</th><th>Unité</th></tr><tr><td>Flux lumineux</td><td>Φ</td><td>lumen (lm)</td></tr><tr><td>Intensité lumineuse</td><td>I</td><td>candela (cd)</td></tr><tr><td>Éclairement</td><td>E</td><td>lux (lm/m²)</td></tr><tr><td>Luminance</td><td>L</td><td>cd/m² (nit)</td></tr></table><h3>Loi de l’inverse du carré</h3><p>Pour une source ponctuelle : <b>E = I / d²</b> (pour une surface perpendiculaire aux rayons).</p><div class="note"><b>Exemple :</b> projecteur de 1 000 cd. À 2 m : E = 1 000 / 4 = 250 lx. À 4 m : 62,5 lx, soit 4 fois moins, donc 2 stops de moins. En photo/vidéo, doubler la distance coûte 2 stops.</div><h3>Qualité de la lumière</h3><ul><li><b>Température de couleur</b> (K) : tungstène 3 200 K, lumière du jour 5 600 K.</li><li><b>IRC (CRI)</b> : de 0 à 100, fidélité du rendu des couleurs. Pour le cinéma, viser plus de 90. Le <b>TLCI</b> est un indice équivalent pour la caméra.</li><li><b>Spectre</b> : la lumière du soleil et du tungstène est continue ; certaines LED ont des creux spectraux.</li></ul><h3>Sources</h3><ul><li><b>Tungstène / halogène</b> : bon rendu, chaleur, ≈ 15–25 lm/W.</li><li><b>HMI</b> (décharge) : lumière du jour, ballast nécessaire.</li><li><b>LED</b> : ≈ 80 à plus de 150 lm/W (ordre de grandeur), peu de chaleur, température réglable.</li></ul><h3>Écrans</h3><p>Luminance de référence d’un écran SDR : environ 100 cd/m². Un écran HDR dépasse 1 000 cd/m² en crête.</p>`),
les("📖 3. Électricité sur un tournage ou en régie",`<h3>Grandeurs de base</h3><ul><li><b>U</b> tension (V), <b>I</b> intensité (A), <b>R</b> résistance (Ω).</li><li><b>Loi d’Ohm</b> : U = R × I.</li><li><b>Puissance</b> : P = U × I (W). <b>Énergie</b> : E = P × t (Wh, kWh).</li></ul><div class="note"><b>Calculs types :</b><br>Projecteur de 2 000 W sous 230 V : I = 2 000 / 230 ≈ 8,7 A.<br>Prise 16 A : P max ≈ 16 × 230 = 3 680 W.<br>1 000 W pendant 3 h = 3 kWh.</div><h3>Alternatif</h3><p>Secteur français : 230 V efficaces, 50 Hz, donc crête ≈ 325 V (Ueff × √2) et période de 20 ms. En <b>triphasé</b>, on a 230 V entre une phase et le neutre, 400 V entre deux phases (230 × √3 ≈ 400 V).</p><h3>Sécurité</h3><ul><li><b>Disjoncteur</b> : protège contre la surcharge et le court-circuit. <b>Différentiel (30 mA)</b> : protège les personnes.</li><li>Vérifier la <b>section des câbles</b>, les rallonges déroulées, la <b>mise à la terre</b>, les connecteurs. Ne jamais dépasser la charge d’un circuit.</li><li>Répartir les charges sur plusieurs circuits.</li></ul><h3>Batteries</h3><ul><li><b>Énergie (Wh) = tension (V) × capacité (Ah)</b>. Exemple : 14,4 V × 6,8 Ah ≈ 98 Wh.</li><li><b>Autonomie</b> ≈ énergie / puissance de la caméra : 98 Wh / 49 W = 2 h.</li><li><b>Avion</b> : jusqu’à 100 Wh sans autorisation ; entre 100 et 160 Wh, accord de la compagnie nécessaire (règles à vérifier avant le voyage).</li></ul>`),
les("📖 4. Acoustique : son, décibels et salles",`<h3>Le son</h3><p>Onde mécanique de pression qui ne se propage pas dans le vide. Vitesse dans l’air : <b>≈ 343 m/s à 20 °C</b>. Fréquences audibles : <b>20 Hz à 20 kHz</b>. Longueur d’onde : <b>λ = v / f</b> (1 kHz → 0,34 m ; 20 Hz → 17 m ; 20 kHz → 17 mm).</p><h3>Le décibel</h3><ul><li>Niveau d’intensité : <b>L = 10 log (I / I₀)</b>, avec I₀ = 10⁻¹² W/m². Niveau de pression : L = 20 log (p / p₀), p₀ = 20 µPa.</li><li><b>+3 dB</b> quand la puissance double (deux sources identiques et incohérentes : 90 dB + 90 dB ≈ 93 dB).</li><li><b>−6 dB</b> à chaque doublement de distance (source ponctuelle, champ libre).</li><li>Gain d’un amplificateur : 20 log (Us / Ue) pour des tensions.</li></ul><h3>Propagation</h3><ul><li><b>Réflexion</b> (écho, réverbération), <b>absorption</b> (mousse, rideaux), <b>diffraction</b>, <b>interférences</b> (filtrage en peigne si deux micros captent la même source à des distances différentes, d’où la règle des 3:1).</li></ul><h3>Acoustique des salles</h3><p>Durée de réverbération (formule de Sabine) : <b>T60 ≈ 0,161 × V / A</b>, V le volume (m³), A l’aire d’absorption équivalente (m²). Salle de 200 m³ avec A = 40 m² : T60 ≈ 0,8 s.</p><h3>Santé auditive</h3><p>L’exposition prolongée au bruit détruit les cellules ciliées de façon irréversible. En entreprise, le Code du travail impose des mesures de prévention à partir de 80 dB(A) d’exposition quotidienne (seuils à vérifier dans le texte en vigueur).</p>`),
les("📖 5. Numérisation du signal",`<h3>Du signal analogique au numérique</h3><ol><li><b>Filtrage anti-repliement</b> (passe-bas).</li><li><b>Échantillonnage</b> à la fréquence fe.</li><li><b>Quantification</b> sur n bits.</li><li><b>Codage</b> binaire.</li></ol><h3>Shannon-Nyquist</h3><p>Pour ne pas perdre d’information, <b>fe > 2 × fmax</b>. Pour 20 kHz, 44,1 kHz (CD) ou 48 kHz (vidéo) conviennent. Sinon : <b>repliement de spectre</b> (aliasing), irréversible.</p><h3>Quantification</h3><ul><li>n bits → 2ⁿ niveaux (16 bits : 65 536 ; 24 bits : ≈ 16,7 millions).</li><li>Pas de quantification : q = Vmax / 2ⁿ.</li><li><b>SNR ≈ 6,02 n + 1,76 dB</b> : ≈ 98 dB en 16 bits, ≈ 146 dB en 24 bits.</li></ul><h3>Débit</h3><p><b>Débit = fe × n × nombre de canaux</b>. Stéréo 48 kHz / 24 bits : 48 000 × 24 × 2 = 2 304 000 b/s ≈ 2,3 Mb/s. En 5.1 : 6,9 Mb/s.</p><h3>Filtres</h3><p>Un filtre RC passe-bas a pour fréquence de coupure <b>fc = 1 / (2πRC)</b>. R = 1 kΩ et C = 159 nF donnent fc ≈ 1 kHz.</p><h3>Image</h3><p>Même principe en vidéo : l’échantillonnage spatial donne les pixels, la quantification donne la profondeur de bits, d’où le calcul de débit vu en TES.</p>`),
les("📖 6. Chimie appliquée : piles, supports et sécurité",`<h3>Atomes et ions</h3><p>Un atome est formé d’un noyau (protons, neutrons) entouré d’électrons. Un ion est un atome ayant gagné ou perdu des électrons. Le courant dans un métal est un déplacement d’électrons ; dans une solution, d’ions.</p><h3>Piles et accumulateurs</h3><ul><li>Une pile transforme de l’énergie chimique en énergie électrique grâce à une réaction d’<b>oxydoréduction</b> (échange d’électrons entre un réducteur et un oxydant).</li><li>Un <b>accumulateur</b> est rechargeable : la réaction est inversée à la charge.</li><li>Tensions nominales : <b>alcaline 1,5 V</b>, <b>NiMH 1,2 V</b>, <b>Li-ion 3,6–3,7 V</b> (4,2 V chargée).</li><li>Associer n cellules en série multiplie la tension par n ; en parallèle, on augmente la capacité.</li></ul><h3>Sécurité des batteries lithium</h3><p>Éviter chocs, court-circuits, chaleur, charge avec un chargeur inadapté. Une batterie endommagée peut s’emballer thermiquement. Recyclage obligatoire dans les points de collecte.</p><h3>Photographie argentique</h3><ul><li>Émulsion : cristaux d’<b>halogénures d’argent</b> (AgBr) dans de la gélatine.</li><li><b>Révélateur</b> : réducteur qui transforme les cristaux exposés en argent métallique noir.</li><li><b>Fixateur</b> (thiosulfate) : dissout les cristaux restants pour stabiliser l’image.</li></ul><h3>Entretien et sécurité</h3><ul><li>Nettoyage des optiques : produits adaptés, jamais de solvant agressif sur les traitements.</li><li><b>Triangle du feu</b> : combustible, comburant, énergie d’activation ; le retrait d’un élément éteint le feu. Choisir l’extincteur selon le type de feu (électrique : CO₂).</li></ul>`)
];
LESSONS.eco=[
les("📖 1. Le paysage audiovisuel et son financement",`<div class="note"><b>Avertissement :</b> les règles, seuils et chiffres changent régulièrement. Ce chapitre donne les principes ; pour un cas réel, vérifie sur Légifrance, service-public.fr et le site du CNC. Ce n’est pas un conseil juridique.</div><h3>La chaîne de valeur</h3><ol><li><b>Création</b> : auteurs, scénaristes, réalisateur.</li><li><b>Production</b> : le producteur prend l’initiative et la responsabilité financière de l’œuvre.</li><li><b>Distribution</b> : le distributeur commercialise le film auprès des exploitants et diffuseurs.</li><li><b>Exploitation / diffusion</b> : salles, chaînes de télévision, plateformes, supports vidéo.</li></ol><h3>Les acteurs institutionnels</h3><ul><li><b>CNC</b> : établissement public ; aides financières (automatiques et sélectives), visa d’exploitation, soutien à l’innovation.</li><li><b>Arcom</b> : régule la communication audiovisuelle et numérique (issue de la fusion du CSA et de la Hadopi en 2022).</li></ul><h3>La chronologie des médias</h3><p>Elle fixe l’ordre et les délais d’exploitation d’un film : salle d’abord, puis vidéo / vidéo à la demande, télévision payante, télévision gratuite, abonnement (SVoD). Les délais exacts sont fixés par accords professionnels et évoluent.</p><h3>Modèles économiques</h3><ul><li><b>Billetterie</b>, <b>publicité</b>, <b>abonnement</b>, <b>paiement à l’acte</b>, <b>financement public</b>.</li></ul><h3>Financement d’une œuvre</h3><p>Apport du producteur, <b>préventes</b> et <b>apports de diffuseurs</b>, <b>coproduction</b>, <b>aides</b> (CNC, régions), <b>Sofica</b> (investissement), financement participatif.</p>`),
les("📖 2. La production audiovisuelle, de l’idée à la diffusion",`<h3>Les étapes</h3><ol><li><b>Développement</b> : idée, synopsis, note d’intention, scénario, dossier artistique, recherche de financement.</li><li><b>Préproduction</b> : budget, plan de financement, plan de travail, repérages, casting, assurances, autorisations (lieux, droits à l’image, musique).</li><li><b>Production (tournage)</b> : feuille de service, rapports de tournage, suivi des dépenses, gestion des imprévus.</li><li><b>Postproduction</b> : montage, étalonnage, VFX, son, mixage, livraison.</li><li><b>Distribution et diffusion</b> : promotion, sorties, exploitation.</li></ol><h3>Les métiers de la production</h3><p><b>Producteur</b>, <b>directeur de production</b> (budget, planning), <b>régisseur</b>, <b>assistant de production</b>, <b>1er assistant réalisateur</b> (organisation du plateau), <b>scripte</b> (continuité).</p><h3>Le budget</h3><ul><li><b>Dépenses</b> : scénario et droits, réalisateur et artistes, équipe technique, matériel, décors, postproduction, assurances, frais généraux, <b>aléas</b> (imprévus).</li><li><b>Plan de financement</b> : les ressources doivent couvrir les dépenses.</li><li>Un <b>devis</b> est le document chiffré proposé à un client ; signé, il a valeur contractuelle.</li></ul><h3>Assurances</h3><p>Responsabilité civile, assurance du matériel, assurance « tournage » (dommages, annulation). Elles font partie du plan de production.</p>`),
les("📖 3. La propriété littéraire et artistique",`<h3>Le droit d’auteur</h3><ul><li>Protège les œuvres de l’esprit <b>originales</b> (film, musique, photo, texte, logo, graphisme…). La protection naît <b>à la création</b>, sans formalité.</li><li><b>Droits moraux</b> : paternité (mention du nom), intégrité, divulgation, retrait ou repentir. Ils sont <b>perpétuels, inaliénables, imprescriptibles</b>.</li><li><b>Droits patrimoniaux</b> : reproduction, représentation. Ils durent la vie de l’auteur <b>+ 70 ans</b> après son décès.</li></ul><h3>L’œuvre audiovisuelle</h3><p>Elle est une œuvre de collaboration. Sont présumés coauteurs : l’auteur du scénario, l’auteur de l’adaptation, l’auteur du texte parlé (dialogues), le compositeur de la musique originale et le <b>réalisateur</b>. Les droits patrimoniaux sont en général cédés au producteur par contrat.</p><h3>Les droits voisins</h3><p>Protègent les <b>artistes-interprètes</b>, les <b>producteurs</b> de phonogrammes et de vidéogrammes et les <b>entreprises de communication audiovisuelle</b> (durée en règle générale de 50 ans).</p><h3>Les exceptions</h3><p>Copie privée, <b>courte citation</b> avec mention de la source, parodie / pastiche / caricature, représentation dans le cercle de famille. Une exception s’interprète strictement.</p><h3>Les sociétés de gestion collective</h3><ul><li><b>SACEM</b> : musique. <b>SACD</b> : auteurs dramatiques, scénaristes, réalisateurs. <b>SCAM</b> : documentaire et reportage. <b>ADAGP</b> : arts graphiques et plastiques. <b>ADAMI, SPEDIDAM</b> : artistes-interprètes.</li></ul><h3>Licences</h3><ul><li><b>Creative Commons</b> : BY (attribution), SA (partage dans les mêmes conditions), NC (pas d’usage commercial), ND (pas de modification). Exemple : CC BY-NC-ND.</li><li>« Libre de droits » ne veut pas dire gratuit : il s’agit souvent d’une licence d’utilisation à lire attentivement.</li></ul><div class="note"><b>Cession des droits :</b> chaque droit cédé doit être mentionné distinctement, avec son étendue, sa destination, le lieu et la durée.</div>`),
les("📖 4. Droit à l’image, données personnelles et contrats",`<h3>Les droits de la personnalité</h3><ul><li><b>Droit à l’image</b> et <b>respect de la vie privée</b> (article 9 du Code civil) : on ne peut en principe filmer une personne identifiable et diffuser son image sans son autorisation, de préférence <b>écrite</b>.</li><li><b>Mineurs</b> : accord des représentants légaux.</li><li><b>Lieux publics / foule</b> : tolérance si la personne n’est pas ciblée ; en cas de plan serré ou d’atteinte à la dignité, l’autorisation redevient nécessaire.</li><li><b>Lieux privés et biens</b> : accord du propriétaire (autorisation de tournage).</li></ul><h3>Le RGPD</h3><p>L’image ou la voix d’une personne identifiable est une <b>donnée personnelle</b>. Il faut une finalité claire, une base légale (par exemple le consentement), une information des personnes et le respect de leurs droits (accès, rectification, effacement).</p><h3>Le contrat</h3><ul><li><b>Conditions de validité</b> : consentement, capacité, contenu licite et certain.</li><li>Un contrat engage : le non-respect peut entraîner des dommages et intérêts.</li><li><b>Contrat de cession du droit à l’image</b> : identité, œuvre concernée, supports, durée, territoire, rémunération éventuelle.</li></ul><h3>Devis et facture</h3><ul><li><b>Devis</b> signé = contrat. <b>Facture</b> : date, numérotation continue, identité des parties, numéro SIREN/SIRET, désignation, prix HT, TVA, TTC, date et conditions de paiement, pénalités de retard et indemnité forfaitaire de recouvrement de 40 €.</li><li>Délai de paiement légal maximal entre professionnels : en général 60 jours à compter de la date de facture (ou 45 jours fin de mois).</li></ul>`),
les("📖 5. L’entreprise : formes juridiques et gestion",`<h3>Les formes juridiques</h3><table><tr><th>Forme</th><th>Associés</th><th>Responsabilité</th></tr><tr><td>Entreprise individuelle / micro-entreprise</td><td>1</td><td>Séparation entre patrimoine pro et personnel (depuis 2022)</td></tr><tr><td>EURL / SASU</td><td>1</td><td>Limitée aux apports</td></tr><tr><td>SARL / SAS</td><td>2 ou plus</td><td>Limitée aux apports</td></tr><tr><td>SA</td><td>Plus nombreux</td><td>Limitée aux apports</td></tr><tr><td>Association (loi 1901)</td><td>Au moins 2</td><td>But non lucratif</td></tr></table><p>Le <b>président d’une SAS</b> est assimilé salarié ; le <b>gérant d’une SARL</b> est, selon sa détention du capital, travailleur non salarié (majoritaire) ou assimilé salarié.</p><h3>Les notions de gestion</h3><ul><li><b>Compte de résultat</b> : produits − charges = résultat (bénéfice ou perte).</li><li><b>Charges fixes / variables</b>. <b>Seuil de rentabilité</b> : chiffre d’affaires pour lequel le résultat est nul = charges fixes / taux de marge sur coûts variables.</li><li><b>Bilan</b> : photographie du patrimoine (actif / passif). <b>Trésorerie</b> : entrées et sorties d’argent à un instant donné ; une entreprise rentable peut manquer de trésorerie.</li></ul><h3>La TVA</h3><p>Taxe sur la consommation collectée par l’entreprise. <b>Taux normal : 20 %</b> ; taux réduits (10 %, 5,5 %, 2,1 %). TVA à payer = TVA collectée − TVA déductible.</p><h3>Le statut de micro-entrepreneur</h3><p>Régime simplifié avec des plafonds de chiffre d’affaires fixés par la loi, qui évoluent ; à vérifier sur service-public.fr.</p>`),
les("📖 6. Droit du travail et protection sociale",`<h3>Les contrats</h3><ul><li><b>CDI</b> : contrat de droit commun.</li><li><b>CDD</b> : cas limitativement prévus, durée limitée.</li><li><b>CDD d’usage</b> : possible dans certains secteurs dont le spectacle, la production cinématographique et audiovisuelle, pour des emplois par nature temporaires.</li><li>Alternance, stage, apprentissage.</li></ul><h3>L’intermittence du spectacle</h3><p>Régime d’assurance chômage des artistes (annexe 10) et des techniciens (annexe 8) ; ouverture des droits selon un nombre d’heures travaillées sur une période de référence (historiquement 507 heures sur 12 mois ; règles à vérifier auprès de France Travail).</p><h3>La relation de travail</h3><ul><li><b>Durée légale</b> : 35 h par semaine ; heures supplémentaires au-delà.</li><li><b>Congés payés</b> : 2,5 jours ouvrables par mois travaillé, soit 5 semaines par an.</li><li><b>Convention collective</b> : complète le Code du travail pour le secteur (salaires minimaux, conditions).</li><li><b>Bulletin de paie</b> : salaire brut, cotisations salariales et patronales, salaire net.</li></ul><h3>Représentation et santé-sécurité</h3><ul><li><b>CSE</b> : comité social et économique, obligatoire à partir de 11 salariés.</li><li>L’employeur doit assurer la sécurité : évaluation des risques (document unique), prévention, formation.</li><li>Accident du travail : déclaration et prise en charge par la Sécurité sociale.</li></ul><h3>Les organismes</h3><p><b>Sécurité sociale</b> (maladie, retraite), <b>Urssaf</b> (cotisations), <b>France Travail</b> (emploi et indemnisation), <b>Afdas</b> (formation du secteur culture-médias).</p>`)
];

<script>

let st={g:{},b:{},n:{}};
try{const r=localStorage.getItem("btsapp");if(r)st=Object.assign(st,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("btsapp",JSON.stringify(st))}catch(e){}};
st.bk=st.bk||{};
let cur="home",tab="cours";
let sub="quiz";
</script>
<script>
/* js/core/utils.js — petites fonctions partagées : esc, $, moyenne, formats, niveau XP */

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const avg=id=>{const g=st.g[id]||[];const c=g.reduce((a,x)=>a+x.c,0);return c?g.reduce((a,x)=>a+x.n*x.c,0)/c:null};
const fmt=v=>v==null?"–":v.toFixed(1).replace(".",",");
const lv=()=>{const x=st.xp||0;return "Niveau "+(Math.floor(x/50)+1)+" · "+x+" XP"};
</script>
<script>
/* js/core/fx.js — effets : sons synthétisés, fissures, toasts, succès, confettis, fond animé */

st.snd=st.snd!==false;st.ach=st.ach||[];
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
const OP=()=>document.documentElement.dataset.theme=="onepiece";
let AC=null;
const actx=()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state=="suspended")AC.resume();return AC};
function tone(f1,f2,d,type,v,delay){
 if(!st.snd)return;const c=actx();if(!c)return;
 const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03);
}
const sfx={
 ok:()=>{if(OP()){tone(988,988,.08,"square",.07);tone(1319,1319,.3,"square",.07,.08);tone(1760,1760,.25,"triangle",.06,.16)}else{tone(520,780,.16,"triangle",.16);tone(780,1040,.18,"triangle",.13,.1)}},
 ko:()=>tone(260,140,.3,"sawtooth",.13),
 click:()=>tone(340,300,.06,"sine",.05),
 puru:()=>{for(let i=0;i<6;i++)tone(i%2?820:700,i%2?820:700,.07,"square",.05,i*.09)},
 gacha:()=>{tone(180,90,.08,"square",.08);tone(120,70,.1,"square",.08,.09)},
 boing:()=>tone(180,620,.28,"sine",.1),
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f*1.02,.22,"triangle",.14,i*.12))
};

/* fissure SVG aléatoire (réponse fausse) */
function crack(){
 const col=getComputedStyle(document.documentElement).getPropertyValue("--tx").trim()||"#fff",r=Math.random,
 jag=(x0,y0,x1,y1,n)=>{let d=`M${x0.toFixed(1)} ${y0.toFixed(1)}`;for(let s=1;s<=n;s++){const t=s/n;d+=` L${(x0+(x1-x0)*t+(r()-.5)*16).toFixed(1)} ${(y0+(y1-y0)*t+(r()-.5)*16).toFixed(1)}`}return d},
 cx=40+r()*20,cy=40+r()*20;let p="";
 for(let b=0,n=3+(r()*3|0);b<n;b++){
  const a=r()*6.283,l=30+r()*35,x1=cx+Math.cos(a)*l,y1=cy+Math.sin(a)*l,w=1+r()*1.8,o=.45+r()*.45;
  p+=`<path d='${jag(cx,cy,x1,y1,2+(r()*3|0))}' stroke='${col}' stroke-width='${w.toFixed(1)}' fill='none' opacity='${o.toFixed(2)}' stroke-linecap='round'/>`;
  if(r()<.6){const mx=(cx+x1)/2,my=(cy+y1)/2,a2=a+(r()-.5)*1.6,l2=10+r()*15;
   p+=`<path d='${jag(mx,my,mx+Math.cos(a2)*l2,my+Math.sin(a2)*l2,2)}' stroke='${col}' stroke-width='${(w*.6).toFixed(1)}' fill='none' opacity='${(o*.7).toFixed(2)}' stroke-linecap='round'/>`}
 }
 return"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'>${p}</svg>`).replace(/'/g,"%27");
}

/* notifications, succès, fin de niveau */
function toast(m){
 let c=$("toasts");if(!c){c=document.createElement("div");c.id="toasts";document.body.appendChild(c)}
 const t=document.createElement("div");t.className="toast";t.textContent=m;c.appendChild(t);if(OP())setTimeout(sfx.puru,350);setTimeout(()=>{t.remove();if(OP())sfx.gacha()},3000);
}
function fxAch(k,label){if(st.ach.includes(k))return;st.ach.push(k);save();toast("🏆 Succès débloqué : "+label)}
function fxDone(good,total){
 sfx.win();if(OP())setTimeout(()=>toast("🥤 SUUUUPER !"),1300);
 if(good==total){confetti();fxAch("perfect","💯 Sans faute")}else toast((OP()?"🏴‍☠️ Butin : ":"🏁 Bilan : ")+good+"/"+total);
}
function fxEnter(){const m=$("main");m.classList.remove("enter");void m.offsetWidth;m.classList.add("enter")}
function confetti(){
 if(REDUCE)return;
 const c=document.createElement("canvas");c.className="fxc";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
 const g=c.getContext("2d");if(!g){c.remove();return}
 const cols=OP()?["#f0b429","#e63946","#fff3d1","#1a6aa8","#d4a017"]:["#7c5cff","#18a058","#f5a524","#e5484d","#00b8d9"],
 P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:4+Math.random()*5,c:cols[Math.random()*5|0],r:Math.random()*6}));
 let n=0;(function f(){
  g.clearRect(0,0,c.width,c.height);
  P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore()});
  ++n<110?requestAnimationFrame(f):c.remove();
 })();
}

const sndLabel=()=>$("snd").textContent=st.snd?"🔊 Son":"🔇 Son";sndLabel();

/* fond animé : vagues + points, pulsation à chaque bonne réponse */
let pulse=null,pulseT=0;
let PX=innerWidth/2,PY=innerHeight/2;addEventListener("pointerdown",e=>{PX=e.clientX;PY=e.clientY});
function berry(){
 if(REDUCE)return;const e=document.createElement("div");e.className="berry";
 e.textContent="+"+["100 000","500 000","1 000 000"][Math.random()*3|0]+" ฿";e.style.left=Math.max(8,PX-50)+"px";e.style.top=(PY-20)+"px";
 document.body.appendChild(e);setTimeout(()=>e.remove(),1000);
}
function fxPulse(){if(OP())berry();if(REDUCE)return;pulseT=performance.now();pulse={f:1.6+Math.random()*1.8,d:4+Math.random()*2.2,s:.7+Math.random()*.6,sg:Math.random()<.5?1:-1,dur:1400+Math.random()*600}}
(function(){
 const cv=document.createElement("canvas");cv.id="bgc";document.body.prepend(cv);
 const g=cv.getContext&&cv.getContext("2d");if(!g)return;
 let w,h,dots=[];
 const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
 const size=()=>{const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*d;cv.height=h*d;g.setTransform(d,0,0,d,0,0);
  dots=Array.from({length:Math.max(40,Math.round(w*h/16000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.6,a:Math.random()*.35+.15,p:Math.random()*6.283,s:Math.random()*.6+.3}))};
 addEventListener("resize",size);size();
 (function draw(t){
  g.fillStyle=css("--bg")||"#f4f4f8";g.fillRect(0,0,w,h);
  const rgb=css("--pr")||"255,255,255";let pf=0;
  if(pulse){const k=performance.now()-pulseT;if(k<pulse.dur){const q=k/pulse.dur;pf=Math.sin(q*Math.PI*pulse.f)*Math.exp(-pulse.d*q)*pulse.s*pulse.sg}else pulse=null}
  for(let i=0;i<3;i++){
   g.beginPath();const amp=(22+i*10)*(1+pf*.9),yb=h*(.32+i*.22*(1-pf*.5)),sp=.00035+i*.00012,fr=(.006+i*.002)*(1-pf*.25);
   for(let x=0;x<=w;x+=12){const y=yb+Math.sin(x*fr+t*sp+i*2)*amp;x?g.lineTo(x,y):g.moveTo(x,y)}
   g.strokeStyle=`rgba(${rgb},${.05+i*.02+Math.abs(pf)*.08})`;g.lineWidth=1.2+Math.abs(pf)*1.6;g.stroke();
  }
  dots.forEach(d=>{g.beginPath();g.arc(d.x+Math.sin(t*.0002+d.p)*10,d.y+Math.sin(t*.0009*d.s+d.p)*8*(1+pf*.6),d.r*(1+pf*.5),0,6.283);
   g.fillStyle=`rgba(${rgb},${Math.max(0,d.a+Math.sin(t*.001*d.s+d.p)*.08+Math.abs(pf)*.1)})`;g.fill()});
  requestAnimationFrame(draw);
 })(0);
})();

/* One Piece : navire pirate qui navigue en bas de l'écran (remplaçable par img/ship.png) */
(function(){
 const svg='<svg viewBox="0 0 160 110" width="140" height="96"><path d="M12 70H140L128 94Q80 104 30 94Z" fill="#6b3f1d"/><path d="M18 78H134M24 86H128" stroke="#4a2c12" stroke-width="1.5"/><path d="M12 70H140" stroke="#d4a017" stroke-width="3"/><path d="M12 70V56H36V70Z" fill="#7a4a24"/><circle cx="24" cy="63" r="2.5" fill="#f0b429"/><path d="M140 66L158 52" stroke="#6b3f1d" stroke-width="3.5" stroke-linecap="round"/><path d="M78 14L12 58M78 14L140 66M125 32L152 56" stroke="#4a2c12" stroke-width="1"/><rect x="76" y="14" width="4" height="56" fill="#4a2c12"/><rect x="123" y="30" width="3" height="40" fill="#4a2c12"/><path d="M48 20Q78 32 108 20V54Q78 66 48 54Z" fill="#fff3d1" stroke="#c9b27a"/><circle cx="78" cy="36" r="7" fill="#222"/><circle cx="75.5" cy="35" r="1.7" fill="#fff3d1"/><circle cx="80.5" cy="35" r="1.7" fill="#fff3d1"/><path d="M68 47L88 54M88 47L68 54" stroke="#222" stroke-width="2" stroke-linecap="round"/><path d="M110 36Q125 42 141 36V58Q125 64 110 58Z" fill="#fff3d1" stroke="#c9b27a"/><path d="M78 14L100 8L78 2Z" fill="#111"/><path d="M125 30L140 25L125 20Z" fill="#c0392b"/></svg>';
 document.body.insertAdjacentHTML("beforeend",'<div class="ship">'+svg+'</div>');
 const im=new Image(),b=document.querySelector(".ship");
 im.onload=()=>{b.innerHTML="";im.className="shipimg";b.appendChild(im)};im.src="img/ship.png";
 /* houle : les deux vagues sont pilotées ici (positions --wa / --wb) et le bateau suit la vague arrière.
    hw(u) = hauteur de la surface au-dessus du bas de l'écran, même formule que le tracé SVG (période 300 px, milieu 45 px, ±17,5 px) */
 const hw=u=>{u=((u%300)+300)%300;const k=u<150?1:-1,t=(u%150)/150;return 45+k*70*t*(1-t)};
 let sy=45,sa=0;
 (function loop(now){
  requestAnimationFrame(loop);
  if(!OP()||REDUCE)return;
  const t=now/1000,st0=document.documentElement.style,oa=-((t*60)%600),ob=-((t*80)%400);
  st0.setProperty("--wa",oa.toFixed(1)+"px");st0.setProperty("--wb",ob.toFixed(1)+"px");
  const W=b.offsetWidth||140,cx=b.offsetLeft+W/2,L=W*.38,
   hS=hw(cx-L-oa),hC=hw(cx-oa),hB=hw(cx+L-oa),
   ty=(hS+hC+hB)/3,ta=Math.max(-9,Math.min(9,-Math.atan((hB-hS)/(2*L))*57.3*.6));
  sy+=(ty-sy)*.2;sa+=(ta-sa)*.2;
  b.style.transform="translateY("+(-(sy-24)).toFixed(1)+"px) rotate("+sa.toFixed(2)+"deg)";
 })(0);
})();

<script>
/* js/ui/nav.js — barre latérale, navigation et ordre des matières (glisser-déposer, sauvegardé dans st.order) */

let LASTDRAG=0;
/* matières triées selon l’ordre choisi ; les nouvelles matières (absentes de st.order) restent à la fin */
const SO=()=>{const o=st.order||[];return [...S].sort((a,b)=>{const i=o.indexOf(a.id),j=o.indexOf(b.id);return(i<0?1e3:i)-(j<0?1e3:j)})};
function setOrder(ids,focus){
 st.order=ids;save();nav();if(cur=="home")home();
 if(focus){const f=$("nav").querySelector('[data-id="'+focus+'"]');if(f)f.focus()}
}
function nav(){
 $("nav").innerHTML=`<button class="${cur=="home"?"on":""}" data-id="home">🏠 Tableau de bord</button>`
 +SO().map(s=>`<button class="${cur==s.id?"on":""}" data-id="${s.id}" title="Glisse pour réorganiser (ou Alt + flèches)">${s.i} ${s.n}</button>`).join("")
 +`<small class="navx mu">↕ Glisse les matières pour les réorganiser${st.order&&st.order.length?` · <a href="#" id="nreset">↺ ordre par défaut</a>`:""}</small>`;
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(performance.now()-LASTDRAG<400)return;cur=b.dataset.id;tab="cours";go()});
 const r=$("nreset");if(r)r.onclick=e=>{e.preventDefault();delete st.order;save();nav();if(cur=="home")home()};
 dragNav();
}

/* glisser-déposer au pointeur : souris (dès 5 px de déplacement) et tactile (appui long 0,3 s) ; Alt + flèches au clavier */
function dragNav(){
 const box=$("nav"),items=()=>[...box.querySelectorAll("button[data-id]:not([data-id=home])")];
 items().forEach(b=>{
  b.onkeydown=e=>{
   if(!e.altKey)return;
   const k=e.key,d=(k=="ArrowUp"||k=="ArrowLeft")?-1:(k=="ArrowDown"||k=="ArrowRight")?1:0;
   if(!d)return;e.preventDefault();
   const ids=SO().map(s=>s.id),i=ids.indexOf(b.dataset.id),j=i+d;
   if(j<0||j>=ids.length)return;
   ids.splice(j,0,ids.splice(i,1)[0]);setOrder(ids,b.dataset.id);
  };
  b.onpointerdown=e=>{
   if(e.pointerType=="mouse"&&e.button!==0)return;
   const touch=e.pointerType!="mouse",sx=e.clientX,sy=e.clientY,pid=e.pointerId,id=b.dataset.id,horiz=getComputedStyle(box).display=="flex";
   let on=false,tm=0,rects=[],others=[],t=0;
   const mark=()=>{others.forEach(o=>o.classList.remove("ins-before","ins-after"));if(t<others.length)others[t].classList.add("ins-before");else if(others.length)others[others.length-1].classList.add("ins-after")};
   const pos=(x,y)=>{const p=horiz?x:y;let n=0;rects.forEach(r=>{if(p>(horiz?r.left+r.width/2:r.top+r.height/2))n++});return n};
   const clean=()=>{b.classList.remove("drag");b.style.transform="";document.body.classList.remove("dragging");others.forEach(o=>o.classList.remove("ins-before","ins-after"))};
   const begin=()=>{
    on=true;others=items().filter(x=>x!==b);rects=others.map(x=>x.getBoundingClientRect());
    b.classList.add("drag");document.body.classList.add("dragging");box.classList.toggle("horiz",horiz);
    try{b.setPointerCapture(pid)}catch(_){}
    if(navigator.vibrate)navigator.vibrate(12);
   };
   const stop=()=>{clearTimeout(tm);removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("pointercancel",cancel);removeEventListener("touchmove",tmv)};
   const move=ev=>{
    if(ev.pointerId!==pid)return;
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!on){
     if(touch){if(Math.hypot(dx,dy)>8)stop()}   /* le doigt défile : ce n’est pas un glisser */
     else if(Math.hypot(dx,dy)>5)begin();
     if(!on)return;
    }
    b.style.transform=`translate(${horiz?dx:0}px,${horiz?0:dy}px)`;
    t=pos(ev.clientX,ev.clientY);mark();
   };
   const up=ev=>{
    if(ev.pointerId!==pid)return;
    const was=on;stop();if(!was)return;
    LASTDRAG=performance.now();clean();
    const ids=others.map(x=>x.dataset.id);ids.splice(t,0,id);
    if(ids.join()!==SO().map(s=>s.id).join())setOrder(ids,id);
   };
   const cancel=ev=>{if(ev.pointerId!==pid)return;const was=on;stop();if(was){LASTDRAG=performance.now();clean()}};
   const tmv=ev=>{if(on&&ev.cancelable)ev.preventDefault()};
   b.oncontextmenu=ev=>{if(on)ev.preventDefault()};
   addEventListener("pointermove",move);addEventListener("pointerup",up);addEventListener("pointercancel",cancel);
   addEventListener("touchmove",tmv,{passive:false});
   if(touch)tm=setTimeout(begin,320);
  };
 });
}

function go(){nav();cur=="home"?home():subj();window.scrollTo(0,0);fxEnter()}
</script>

<script>
/* js/features/quiz.js — quiz rapide (QCM de la matière) */

function quiz(s){
 let i=0,score=0;
 /* ordre des questions ET des réponses mélangé à chaque partie */
 const Q=s.quiz.map(q=>{const o=q.o.map((x,k)=>[x,k==q.a]).sort(()=>Math.random()-.5);return{q:q.q,e:q.e,o:o.map(x=>x[0]),a:o.findIndex(x=>x[1])}}).sort(()=>Math.random()-.5);
 const show=()=>{
  if(i>=Q.length){
   if(st.b[s.id]==null||score>st.b[s.id])st.b[s.id]=score;save();
   $("sb").innerHTML=`<div class="card"><h3>Résultat : ${score} / ${Q.length}</h3><button class="btn p" id="again">Recommencer</button></div>`;
   $("again").onclick=()=>quiz(s);fxDone(score,Q.length);return;
  }
  const q=Q[i];
  $("sb").innerHTML=`<div class="card"><span class="mu">Question ${i+1}/${Q.length}</span><h3>${esc(q.q)}</h3>${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}<p id="fb"></p></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k;
   document.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j==q.a)x.classList.add("ok")});
   srRec(srKeyQ(s.id,q.q),k==q.a);if(k==q.a){score++;st.xp=(st.xp||0)+10;save();b.classList.add("fresh");sfx.ok();fxPulse()}else{b.classList.add("ko","fresh");b.insertAdjacentHTML("beforeend",`<i class="crack-overlay" style="background-image:url('${crack()}')"></i>`);sfx.ko()}
   $("fb").innerHTML=`${esc(q.e)}<br><button class="btn p" id="nx">Suivant →</button>`;
   $("nx").onclick=()=>{i++;show()};
  });
 };

<script>
/* js/features/banks.js — banques de questions : niveaux, bilan, raccourcis clavier */

const bs=id=>{let g=0,t=0;(BANKS[id]||[]).forEach(b=>b.levels.forEach((l,k)=>{const P=st.bk[b.id+k]||{a:{}};t+=l.q.length;l.q.forEach((q,i)=>{if(P.a[i]===q.c)g++})}));return t?g+"/"+t:"–"};
let CB=null;
function banks(s){
 const L=BANKS[s.id]||[];
 $("sb").innerHTML=L.length?L.map((b,i)=>`<div class="card stat" data-i="${i}" style="--c:${s.c}"><b style="font-size:1.1rem">${b.i} ${esc(b.n)}</b><span class="mu">${esc(b.d)}<br>${b.levels.reduce((a,l)=>a+l.q.length,0)} questions · réussies : ${bs(s.id)}</span></div>`).join(""):`<div class="card mu">Pas encore de banque de questions pour cette matière.</div>`;
 $("sb").querySelectorAll(".stat").forEach(c=>c.onclick=()=>openBank(s,L[+c.dataset.i],0));
}
function openBank(s,b,l){
 const lv=b.levels[l],k=b.id+l,P=st.bk[k]||(st.bk[k]={a:{},f:[]});
 let ord=lv.q.map((_,i)=>i),auto=true,str=0,fresh=-1,t0=Date.now(),cur=Math.max(0,ord.findIndex(i=>P.a[i]==null));
 const ok=i=>P.a[i]===lv.q[i].c,fmtT=()=>{const x=((Date.now()-t0)/1000)|0;return String(x/60|0).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};
 clearInterval(window.CT);window.CT=setInterval(()=>{const e=$("tm");e?e.textContent=fmtT():clearInterval(window.CT)},1000);
 const ans=j=>{const i=ord[cur],q=lv.q[i];if(P.a[i]!=null)return;P.a[i]=j;fresh=j;srRec(srKeyB(b,l,i),j==q.c);if(j==q.c){str++;st.xp=(st.xp||0)+5;sfx.ok();fxPulse();if(str==5)fxAch("streak5","🔥 Série de 5");if(str==10)fxAch("streak10","⚡ Série de 10");if(str==20)fxAch("streak20","🌟 Série de 20")}else{str=0;sfx.ko()}save();R();fresh=-1;
  if(Object.keys(P.a).length==lv.q.length)fxDone(lv.q.filter((_,x)=>P.a[x]===lv.q[x].c).length,lv.q.length);
  if(j==q.c&&auto&&cur<ord.length-1)setTimeout(()=>{if(CB&&$("fl")&&ord[cur]==i){cur++;R()}},900)};
 const go=d=>{cur=Math.max(0,Math.min(ord.length-1,cur+d));R()};
 CB={ans,go,flag:()=>{const i=ord[cur],x=P.f.indexOf(i);x<0?P.f.push(i):P.f.splice(x,1);save();R()}};
 function R(){
  const i=ord[cur],q=lv.q[i],a=P.a[i],done=Object.keys(P.a).length,good=lv.q.filter((_,x)=>ok(x)).length,fin=done==lv.q.length;
  if(fin&&good>(P.best||0)){P.best=good;save()}
  const bad=lv.q.map((_,x)=>x).filter(x=>P.a[x]!=null&&!ok(x)).map(x=>x+1);
  $("sb").innerHTML=`<div class="tabs"><button id="b0">← Banques</button>${b.levels.length>1?b.levels.map((x,j)=>`<button class="${j==l?"on":""}" data-l="${j}">${x.n}</button>`).join(""):""}<button id="sh">🔀 Mélanger</button><button id="au" class="${auto?"on":""}">⏭ Auto</button><button id="rs">↺</button></div>
  <div class="mu">✓ ${good}/${lv.q.length} · <span class="${str>=5?"hot":""}">🔥 ${str}</span> · ⏱ <span id="tm">${fmtT()}</span></div><div class="bar"><i style="width:${done/lv.q.length*100}%"></i></div>
  ${fin?`<div class="card"><h3>🏁 Bilan : ${good}/${lv.q.length} (${Math.round(good/lv.q.length*100)}%)</h3><p class="mu">Record : ${P.best}/${lv.q.length}${bad.length?"<br>À revoir : n° "+bad.join(", "):""}${P.f.length?"<br>⭐ Marquées : n° "+P.f.map(x=>x+1).join(", "):""}</p>${l<b.levels.length-1?`<button class="btn p" id="nl">Niveau suivant →</button>`:""}</div>`:""}
  <div class="card"><span class="tag">${esc(q.s||lv.n)}</span> <span class="mu">Question ${cur+1}/${lv.q.length}</span><button class="btn" id="fl" style="float:right" title="Marquer à revoir (F)">${P.f.includes(i)?"★":"☆"}</button><h3>${esc(q.q)}</h3>
  ${q.o.map((o,j)=>`<button class="opt ${a!=null?(j==q.c?"ok":j==a?"ko":""):""}${j==fresh?" fresh":""}" ${a!=null?"disabled":""} data-j="${j}"><b>${"ABCDE"[j]}</b> ${esc(o)}${j==fresh&&j!=q.c?`<i class="crack-overlay" style="background-image:url('${crack()}')"></i>`:""}</button>`).join("")}
  ${a!=null?`<p><b>${a==q.c?"✅ Bonne réponse !":"❌ Raté."}</b><br><span class="mu">${esc(q.e||"")}</span></p>`:""}
  <div class="tabs"><button id="pv">← Préc.</button><button id="nx" class="p">Suiv. →</button></div></div>
  <div>${ord.map((x,n)=>`<button class="dot ${P.a[x]==null?"":ok(x)?"g":"r"} ${n==cur?"c":""}" data-n="${n}" title="${x+1}"></button>`).join("")}</div>
  <div class="row" style="grid-template-columns:1fr auto"><input id="jn" type="number" min="1" max="${lv.q.length}" placeholder="N° de question"><button class="btn" id="jb">Aller à</button></div>
  <p class="mu">Raccourcis : A–E ou 1–5 pour répondre, ← → pour naviguer, F pour marquer.</p>`;
  $("b0").onclick=()=>{clearInterval(window.CT);CB=null;banks(s)};
  $("sb").querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>openBank(s,b,+x.dataset.l));
  $("sb").querySelectorAll(".opt").forEach(x=>x.onclick=()=>ans(+x.dataset.j));
  $("sb").querySelectorAll(".dot").forEach(x=>x.onclick=()=>{cur=+x.dataset.n;R()});
  $("sh").onclick=()=>{ord.sort(()=>Math.random()-.5);cur=0;R()};
  $("au").onclick=()=>{auto=!auto;R()};
  $("rs").onclick=()=>{if(confirm("Effacer les réponses de ce niveau ?")){st.bk[k]={a:{},f:[]};save();openBank(s,b,l)}};
  $("fl").onclick=CB.flag;$("pv").onclick=()=>go(-1);$("nx").onclick=()=>go(1);
  $("jb").onclick=()=>{const n=parseInt($("jn").value);if(n>=1&&n<=lv.q.length){cur=ord.indexOf(n-1);R()}};
  if($("nl"))$("nl").onclick=()=>openBank(s,b,l+1);
 }
 R();
}
document.addEventListener("keydown",e=>{
 if(!CB||!$("fl")||/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;
 const kk=e.key.toLowerCase(),n="abcde".indexOf(kk),m=n>=0?n:"12345".indexOf(kk);
 if(m>=0)CB.ans(m);else if(kk=="arrowright")CB.go(1);else if(kk=="arrowleft")CB.go(-1);else if(kk=="f")CB.flag();
});
</script>
<script>
/* js/features/devoirs.js — devoirs, notes et moyennes pondérées */

function dev(s){
 const g=st.g[s.id]||(st.g[s.id]=[]);
 $("sb").innerHTML=`<div class="card"><h3>Moyenne : ${fmt(avg(s.id))} / 20</h3>
 <table><tr><th>Devoir</th><th>Note</th><th>Coef.</th><th></th></tr>${g.map((x,k)=>`<tr><td>${esc(x.t)}</td><td>${fmt(x.n)}/20</td><td>${x.c}</td><td><button class="btn" data-d="${k}">✕</button></td></tr>`).join("")||`<tr><td colspan="4" class="mu">Aucun devoir pour l’instant.</td></tr>`}</table>
 <div class="row"><input id="dt" placeholder="Titre du devoir"><input id="dn" type="number" min="0" max="20" step="0.25" placeholder="Note /20"><input id="dc" type="number" min="1" step="1" value="1" placeholder="Coef."><button class="btn p" id="da">Ajouter</button></div></div>`;
 $("da").onclick=()=>{
  const n=parseFloat($("dn").value),c=parseFloat($("dc").value)||1;
  if(isNaN(n)||n<0||n>20)return;
  g.push({t:$("dt").value||"Devoir",n,c});save();fxWanted($("dt").value||"Devoir",n);dev(s);
 };
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{g.splice(+b.dataset.d,1);save();dev(s)});
}
</script>
<script>
/* js/features/revision.js — répétition espacée (paliers de 1, 3 et 7 jours) et mode « questions ratées »
   Données : st.sr[clé] = {b: palier 1-3, d: date d’échéance (ms), r: 1 si dans la liste des ratées, n: nombre d’erreurs}
   Clés : "b|idBanque|niveau|n°" (banques) · "q|idMatière|empreinte" (quiz rapide) */

const SR_DAYS=[1,3,7],DAY=864e5,SR_MAX=25;
st.sr=st.sr||{};
const srHash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
const srKeyB=(b,l,i)=>"b|"+b.id+"|"+l+"|"+i;
const srKeyQ=(sid,q)=>"q|"+sid+"|"+srHash(q);
const srWhen=d=>{const n=Math.ceil((d-Date.now())/DAY);return n<=0?"aujourd’hui":n==1?"demain":"dans "+n+" jours"};

/* enregistre une réponse : une erreur programme un retour à J+1 ; une réussite à l’échéance fait avancer le palier */
function srRec(key,ok){
 const now=Date.now(),e=st.sr[key];
 if(!ok){st.sr[key]={b:1,d:now+DAY*SR_DAYS[0],r:1,n:(e&&e.n||0)+1};save();return}
 if(!e)return;
 e.r=0;
 if(e.d<=now){if(e.b>=SR_DAYS.length)delete st.sr[key];else{e.b++;e.d=now+DAY*SR_DAYS[e.b-1]}}
 save();
}

/* reprise de l’existant : les erreurs déjà enregistrées dans les banques sont à revoir dès maintenant */
function srMigrate(){
 if(st.srInit)return;const now=Date.now();
 Object.keys(BANKS).forEach(id=>BANKS[id].forEach(b=>b.levels.forEach((lv,l)=>{
  const P=st.bk[b.id+l];if(!P)return;
  lv.q.forEach((q,i)=>{if(P.a[i]!=null&&P.a[i]!==q.c){const k=srKeyB(b,l,i);if(!st.sr[k])st.sr[k]={b:1,d:now,r:1,n:1}}});
 })));
 st.srInit=1;save();
}
srMigrate();

/* toutes les questions d’une matière, sous une forme unique */
function srItems(s){
 const out=[];
 (BANKS[s.id]||[]).forEach(b=>b.levels.forEach((lv,l)=>{
  const pk=b.id+l,P=st.bk[pk]||{a:{},f:[]};
  lv.q.forEach((q,i)=>out.push({k:srKeyB(b,l,i),q:q.q,o:q.o,c:q.c,e:q.e||"",t:b.n,pk,i,fl:(P.f||[]).includes(i)}));
 }));
 (s.quiz||[]).forEach(q=>out.push({k:srKeyQ(s.id,q.q),q:q.q,o:q.o,c:q.a,e:q.e||"",t:"Quiz rapide",fl:false}));
 return out;
}
const srIsDue=x=>{const e=st.sr[x.k];return !!e&&e.d<=Date.now()};
const srIsBad=x=>{const e=st.sr[x.k];return (!!e&&!!e.r)||x.fl};
const srDue=s=>srItems(s).filter(srIsDue).length;

/* ---------- écran d’accueil de l’onglet ---------- */
let RV=null;
function rev(s){
 CB=null;clearInterval(window.CT);RV=null;
 const all=srItems(s),due=all.filter(srIsDue),bad=all.filter(srIsBad),tr=all.filter(x=>st.sr[x.k]);
 const pal=[1,2,3].map(p=>tr.filter(x=>st.sr[x.k].b==p).length);
 const nx=tr.map(x=>st.sr[x.k].d).filter(d=>d>Date.now()).sort((a,b)=>a-b)[0];
 $("sb").innerHTML=`<div class="rvgrid">
 <div class="card"><h3>📅 Révision du jour</h3><div class="rvn">${due.length}</div>
 <p class="mu">${due.length?"question"+(due.length>1?"s":"")+" à revoir aujourd’hui (séance de "+SR_MAX+" au maximum).":"Rien à revoir pour l’instant."+(nx?" Prochaine échéance : "+srWhen(nx)+".":" Les questions ratées apparaîtront ici.")}</p>
 ${due.length?`<button class="btn p" id="rvd">▶ Lancer la révision</button>`:""}</div>
 <div class="card"><h3>❌ Questions ratées et ⭐</h3><div class="rvn">${bad.length}</div>
 <p class="mu">${bad.length?"question"+(bad.length>1?"s":"")+" ratée"+(bad.length>1?"s":"")+" ou marquée"+(bad.length>1?"s":"")+" ⭐ (séance de "+SR_MAX+" au maximum).":"Aucune erreur en attente : bravo !"}</p>
 ${bad.length?`<button class="btn p" id="rvb">▶ Réviser mes erreurs</button>`:""}</div></div>
 <div class="card"><h3>🧠 Comment ça marche</h3>
 <p class="mu">Une question ratée dans un quiz ou une banque revient le lendemain. Réussie, elle revient 3 jours plus tard, à nouveau 7 jours plus tard ; à la suite de cette troisième réussite, elle est considérée comme maîtrisée. Une nouvelle erreur la ramène au premier palier.</p>
 <p class="mu">Les questions ⭐ restent dans la liste des erreurs tant que l’étoile n’est pas retirée (bouton ★ pendant la séance).</p>
 <p><span class="tag">1 jour : ${pal[0]}</span><span class="tag">3 jours : ${pal[1]}</span><span class="tag">7 jours : ${pal[2]}</span></p></div>`;
 if($("rvd"))$("rvd").onclick=()=>revStart(s,"due");
 if($("rvb"))$("rvb").onclick=()=>revStart(s,"bad");
}

/* ---------- séance ---------- */
function revStart(s,mode){
 const all=srItems(s),L=all.filter(mode=="due"?srIsDue:srIsBad).sort(()=>Math.random()-.5).slice(0,SR_MAX);
 if(!L.length)return rev(s);
 L.forEach(x=>{const o=x.o.map((t,k)=>[t,k==x.c]).sort(()=>Math.random()-.5);x.o=o.map(z=>z[0]);x.c=o.findIndex(z=>z[1])});
 RV={s,mode,L,i:0,good:0,a:null,msg:""};revShow();
}
function revShow(){
 const R=RV,x=R.L[R.i];if(!x)return revEnd();
 const a=R.a,done=R.i+(a!=null?1:0);
 $("sb").innerHTML=`<div class="tabs"><button id="rvq">← Révision</button></div>
 <div class="mu">Question ${R.i+1}/${R.L.length} · ✓ ${R.good}</div><div class="bar"><i style="width:${done/R.L.length*100}%"></i></div>
 <div class="card"><span class="tag">${esc(x.t)}</span>${x.pk?`<button class="btn" id="rvf" style="float:right" title="Marquer ou retirer l’étoile">${x.fl?"★":"☆"}</button>`:""}<h3>${esc(x.q)}</h3>
 <div id="rvo">${x.o.map((o,j)=>`<button class="opt ${a!=null?(j==x.c?"ok":j==a?"ko":""):""}${j==a&&a!=x.c?" fresh":""}" ${a!=null?"disabled":""} data-j="${j}"><b>${"ABCDE"[j]}</b> ${esc(o)}${j==a&&a!=x.c?`<i class="crack-overlay" style="background-image:url('${crack()}')"></i>`:""}</button>`).join("")}</div>
 ${a!=null?`<p><b>${a==x.c?"✅ Bonne réponse !":"❌ Raté."}</b><br><span class="mu">${esc(x.e)}</span><br><span class="mu">${R.msg}</span></p><button class="btn p" id="rvn">${R.i<R.L.length-1?"Suivant →":"Terminer"}</button>`:""}</div>
 <p class="mu">Raccourcis : A–E ou 1–5 pour répondre, Entrée pour continuer.</p>`;
 $("rvq").onclick=()=>{RV=null;rev(R.s)};
 $("sb").querySelectorAll(".opt").forEach(b=>b.onclick=()=>revAns(+b.dataset.j));
 if($("rvn"))$("rvn").onclick=revNext;
 if($("rvf"))$("rvf").onclick=()=>{const P=st.bk[x.pk]||(st.bk[x.pk]={a:{},f:[]}),p=P.f.indexOf(x.i);p<0?P.f.push(x.i):P.f.splice(p,1);x.fl=!x.fl;save();revShow()};
}
function revAns(j){
 const R=RV,x=R.L[R.i];if(!R||R.a!=null)return;
 const ok=j==x.c;R.a=j;srRec(x.k,ok);
 if(ok){R.good++;st.xp=(st.xp||0)+5;sfx.ok();fxPulse()}else sfx.ko();
 const e=st.sr[x.k];
 R.msg=ok?(e?"🔁 Prochaine révision : "+srWhen(e.d)+".":"🎓 Question maîtrisée."):"🔁 Elle reviendra demain.";
 save();revShow();
}
function revNext(){RV.i++;RV.a=null;revShow()}
function revEnd(){
 const R=RV,tot=R.L.length,rest=srItems(R.s).filter(R.mode=="due"?srIsDue:srIsBad).length;
 st.rvc=(st.rvc||0)+tot;save();
 $("sb").innerHTML=`<div class="card"><h3>🏁 Séance terminée : ${R.good}/${tot}</h3>
 <p class="mu">${rest?rest+" question"+(rest>1?"s":"")+" encore en attente.":"Plus rien en attente pour cette séance."}</p>
 <button class="btn p" id="rvr">← Retour</button>${rest?` <button class="btn" id="rvm">Séance suivante (${rest})</button>`:""}</div>`;
 const s=R.s,mode=R.mode;
 $("rvr").onclick=()=>{RV=null;rev(s)};
 if($("rvm"))$("rvm").onclick=()=>revStart(s,mode);
 fxDone(R.good,tot);fxAch("rev1","🔁 Première séance de révision");if(st.rvc>=100)fxAch("rev100","📅 100 questions révisées");
}
document.addEventListener("keydown",e=>{
 if(!RV||!$("rvo")||/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;
 const kk=e.key.toLowerCase(),n="abcde".indexOf(kk),m=n>=0?n:"12345".indexOf(kk);
 if(RV.a==null){if(m>=0&&m<RV.L[RV.i].o.length)revAns(m)}else if(kk=="enter"||kk=="arrowright")revNext();
});
</script>
<script>
/* js/app.js — démarrage : thème, écran d’accueil, premier affichage (toujours chargé en dernier) */

const TH=["dark","light","onepiece","zelda"],TL={dark:"🌙 Sombre",light:"☀️ Clair",onepiece:"🏴‍☠️ One Piece",zelda:"🔺 Zelda"};

 dark:{i:"🎬",r:"● REC",s:"▶ Démarrer"},
 light:{i:"🎬",r:"● REC",s:"▶ Démarrer"},
 onepiece:{i:"🏴‍☠️",r:"⚓ LEVER L’ANCRE",s:"⚓ Prendre le large"},
 zelda:{i:"🔺",r:"🔺 HYRULE",s:"🗡️ Partir à l’aventure"}
};

 const x=TX[t]||TX.dark;document.documentElement.dataset.theme=t;st.theme=t;save();$("theme").textContent=TL[t];
 $("logo").textContent=x.i+" BTS Audiovisuel";document.querySelector(".rec").textContent=x.r;$("start").textContent=x.s;if(window.jar)jar();
};
if(TH.includes(st.theme))setTh(st.theme);
$("theme").onclick=()=>{
 const c=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),n=TH[(TH.indexOf(c)+1)%TH.length];
 setTh(n);if(n=="onepiece"||n=="zelda")sfx.win();
};
$("lvl").textContent=lv();
$("start").onclick=()=>{$("intro").style.display="none";go()};

go();
</script>
